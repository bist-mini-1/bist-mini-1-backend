server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bist-mini-backend

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/xepdb1}
    username: ${DB_USERNAME:sys}
    password: ${DB_PASSWORD:oracle}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.bist.mini
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

logging:
  level:
    com.bist.mini.comment.dao: debug
